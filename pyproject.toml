[project]
name = "floorplan-engine"
version = "0.1.0"
description = "Floor plan wall & room detection engine"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0,<4",
    "opencv-python-headless>=4.9,<5",
    "numpy>=1.26,<3",
    "pdf2image>=1.17,<2",
    "pypdf>=5,<7",
    "pytesseract>=0.3.10,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
]
desktop = [
    "pywebview>=6.2,<7; sys_platform == 'darwin'",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["engine*"]
